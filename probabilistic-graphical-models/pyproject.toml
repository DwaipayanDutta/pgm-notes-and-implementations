[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pgm-handbook"
dynamic = ["version"]
description = "Probabilistic graphical models: representation, exact/approximate inference and Bayesian deep learning."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dwaipayan Dutta" }]
keywords = [
    "probabilistic graphical models",
    "bayesian networks",
    "markov networks",
    "mcmc",
    "gibbs sampling",
    "variable elimination",
    "bayesian neural networks",
    "sgld",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy", "networkx"]

[project.optional-dependencies]
deep = ["torch"]
dev = ["pytest", "torch", "scipy", "matplotlib", "jupyter", "nbconvert"]

[project.urls]
Homepage = "https://github.com/DwaipayanDutta/pgm-notes-and-implementations"
Repository = "https://github.com/DwaipayanDutta/pgm-notes-and-implementations"
Issues = "https://github.com/DwaipayanDutta/pgm-notes-and-implementations/issues"

[tool.setuptools.dynamic]
version = { attr = "pgm_handbook.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
